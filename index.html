<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do ESP32</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9; }
    h1 { color: #333; }
    .btn { padding: 15px 30px; font-size: 18px; margin: 10px; border: none; cursor: pointer; border-radius: 5px; }
    .on { background-color: #4CAF50; color: white; }
    .off { background-color: #f44336; color: white; }
    .sensor-card { background: white; padding: 20px; display: inline-block; border-radius: 10px; margin-top: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .val { font-size: 32px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <h1>Controle do LED</h1>
  <button class="btn on" onclick="mudarEstado(1)">LIGAR</button>
  <button class="btn off" onclick="mudarEstado(0)">DESLIGAR</button>
  <p id="status">Status: Aguardando ação...</p>

  <hr style="max-width: 400px; margin: 30px auto;">

  <div class="sensor-card">
    <h2>Nível do Sensor</h2>
    <div class="val" id="distancia">-- %</div>
  </div>

  <script>
    const DB_URL = "https://led-status-65919-default-rtdb.asia-southeast1.firebasedatabase.app";
    const DB_AUTH = "BxKKfrqvwwVtHS1dUojCWyLvbrGSpsQcqgzhe4Po";

    function mudarEstado(valor) {
      fetch(`${DB_URL}/led/led_status.json?auth=${DB_AUTH}`, {
        method: 'PUT',
        body: JSON.stringify(valor)
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('status').innerText = "Status atualizado para: " + data;
      });
    }

    // Função que converte a distância do Firebase para Porcentagem a cada 2 segundos
    function lerSensor() {
      fetch(`${DB_URL}/sensor/distancia.json?auth=${DB_AUTH}`)
      .then(res => res.json())
      .then(dist => {
        if(dist !== null) {
          // Define a distância máxima total considerada (ex: 200 cm)
          const distMaxima = 200; 

          // Calcula a porcentagem (0% a 100%)
          let porcentagem = Math.round((dist / distMaxima) * 100);

          // Garante que o valor fique entre 0 e 100
          if (porcentagem > 100) porcentagem = 100;
          if (porcentagem < 0) porcentagem = 0;

          document.getElementById('distancia').innerText = porcentagem + " %";
        }
      });
    }

    setInterval(lerSensor, 2000);
  </script>

</body>
</html>
